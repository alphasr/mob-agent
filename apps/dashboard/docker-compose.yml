# Self-hosted dashboard: Postgres, the dashboard, and Caddy for HTTPS. See SELF_HOSTING.md.
#   cp .env.example .env   # then fill it in
#   docker compose up -d --build

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: textagent
      POSTGRES_DB: textagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'textagent', '-d', 'textagent']
      interval: 5s
      timeout: 5s
      retries: 10

  dashboard:
    build:
      context: ../..
      dockerfile: apps/dashboard/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://textagent:${POSTGRES_PASSWORD}@postgres:5432/textagent
      AUTH_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?set GITHUB_CLIENT_ID in .env}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?set GITHUB_CLIENT_SECRET in .env}
      # Caddy below sets X-Forwarded-For from the real connection; the dashboard is not reachable directly.
      TRUSTED_IP_HEADER: x-forwarded-for

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - dashboard
    ports:
      - '80:80'
      - '443:443'
    environment:
      PUBLIC_URL: ${PUBLIC_URL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
