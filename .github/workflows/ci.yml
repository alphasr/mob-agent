name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macOS so the iMessage package is built and tested where it actually runs.
    runs-on: macos-latest
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
